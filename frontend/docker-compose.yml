services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: maison-postgres
    environment:
      POSTGRES_DB: maisondb
      POSTGRES_USER: maison
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maison}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - maison-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maison -d maisondb"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Spring Boot Backend ───────────────────────────────────────────────────
  backend:
    image: shop-backend
    pull_policy: never
    container_name: maison-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://maison-postgres:5432/maisondb
      SPRING_DATASOURCE_USERNAME: maison
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-maison}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/maison/protocol/openid-connect/certs
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: maison
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      CORS_ALLOWED_ORIGINS: http://localhost
      JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:8000
    ports:
      - "8090:8090"
      - "8000:8000"
    networks:
      - maison-net

  # ── Keycloak ──────────────────────────────────────────────────────────────
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: maison-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME_URL: 'http://localhost:8080'
      KC_HOSTNAME_ADMIN_URL: 'http://localhost:8080'
      KC_HOSTNAME_STRICT: 'false'
      KC_HOSTNAME_STRICT_HTTPS: 'false'
      KC_HTTP_ENABLED: 'true'
      KC_SPI_THEME_STATIC_MAX_AGE: '-1'
      KC_SPI_THEME_CACHE_THEMES: 'false'
      KC_SPI_THEME_CACHE_TEMPLATES: 'false'
      KC_HEALTH_ENABLED: 'true'
    command: start-dev --import-realm --health-enabled=true
    volumes:
      - ../keycloak/realm.json:/opt/keycloak/data/import/realm.json
      - ../keycloak/themes:/opt/keycloak/themes
      - keycloak_data:/opt/keycloak/data
    ports:
      - "8080:8080"
    networks:
      - maison-net

  # ── Angular Frontend ──────────────────────────────────────────────────────
  frontend:
    pull_policy: never
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maison-frontend
    ports:
      - "80:80"
    environment:
      KEYCLOAK_URL: /kc
      KEYCLOAK_REALM: maison
      KEYCLOAK_CLIENT_ID: maison-angular
      API_URL: /api
    networks:
      - maison-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  maison-net:
    driver: bridge

volumes:
  postgres_data:
  keycloak_data:
